{% assign section_url = '/' | relative_url | append: page.section_anchor -%}
<!doctype html>
<html lang="{{ site.locale }}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="0; url={{ section_url | escape }}">
  <title>{{ page.title | escape }}</title>
</head>
<body>
  <a href="{{ section_url | escape }}">{{ page.title | escape }}</a>
</body>
</html>
